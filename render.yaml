services:
  - type: web
    name: tjs-trading
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && gunicorn wsgi:app --config gunicorn.conf.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_KEY
        sync: false
      - key: CMC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///instance/tjs_trading.db
      - key: AUTO_SCAN_ENABLED
        value: "true"
      - key: AUTO_SCAN_INTERVAL_HOURS
        value: "6"
      - key: MARKET_CAP_MIN
        value: "50000000"
      - key: SCAN_LIMIT
        value: "10"
    disk:
      name: data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
